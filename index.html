<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B1020">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gestión del Dinero">
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<style>html.locked header.top,html.locked main,html.locked nav.tabs{visibility:hidden}</style>
<script>try{if(localStorage.getItem('gd-lock')==='1')document.documentElement.classList.add('locked')}catch(e){}</script>
<script src="local-db.js"></script>
<script src="mini-xlsx.js"></script>
<title>Gestión del Dinero</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap">
<style>
/* Layout: app de una columna para móvil, cabecera fija arriba y barra de pestañas abajo; tarjetas solo para los bloques clave. */
:root{
  --bg:#0B1020; --surface:#151C2E; --sunk:#1C2540; --ink:#E9EDF6; --ink-2:#B4BED3; --muted:#9AA6BF; --line:#26304A;
  --accent:#3B55E6; --accent-ink:#FFFFFF; --accent-soft:#222C55; --accent-tx:#A5B4FF;
  --good:#6EE7A8; --good-soft:rgba(34,197,94,.14); --bad:#FCA5A5; --bad-soft:rgba(239,68,68,.16); --warn:#FCD34D; --warn-soft:#2A2314;
  --s-ing:#A5B4FF; --s-gas:#5B74F5;
  --f-display:Manrope, system-ui, -apple-system, sans-serif;
  --f-body:Manrope, system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-num:Manrope, system-ui, -apple-system, sans-serif;
  --r:24px; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select{font:inherit;color:inherit}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:-.01em;white-space:nowrap}
.row > .num,.row > .mid,.row > b.num{flex:none}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg)}
header.top .wrap{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding-block:14px 10px}
.brand{font-family:var(--f-display);font-weight:700;font-size:21px;letter-spacing:-.02em}
.brand small{display:block;font-family:var(--f-body);font-weight:500;font-size:12px;color:var(--muted);letter-spacing:.02em}
.top-actions{display:flex;gap:8px}
main.wrap{padding-block:4px calc(96px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:18px}
h2.sec{font-family:var(--f-display);font-weight:700;font-size:18px;letter-spacing:-.01em;margin:6px 0 0;text-wrap:balance}
.eyebrow{font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.card{background:var(--surface);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;min-width:0}
.row > *{min-width:0}
.muted{color:var(--muted)} .ink2{color:var(--ink-2)}
.small{font-size:13px}
.big{font-family:var(--f-num);font-size:30px;font-weight:500;letter-spacing:-.03em;line-height:1.1}
.mid{font-family:var(--f-num);font-size:20px;font-weight:500;letter-spacing:-.02em}
.pos{color:var(--good)} .neg{color:var(--ink)}
.btn{border:0;border-radius:999px;padding:9px 14px;background:var(--sunk);font-weight:600;font-size:13.5px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn:focus-visible,.tab:focus-visible,.chip:focus-visible,.mov:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 10px;font-size:12.5px;font-weight:600;white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.info{background:var(--accent-soft);color:var(--accent-tx)}
.pill svg{width:13px;height:13px}

/* Cobro: la pieza protagonista */
.payday{background:var(--accent);color:var(--accent-ink);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:14px;position:relative;overflow:hidden}
.payday .eyebrow{color:inherit;opacity:.75}
.payday .when{font-family:var(--f-display);font-weight:700;font-size:26px;letter-spacing:-.02em;line-height:1.1}
.payday .amount{font-family:var(--f-num);font-size:34px;font-weight:500;letter-spacing:-.03em}
.payday .count{text-align:right;flex:none}
.payday .count b{display:block;font-family:var(--f-display);font-size:40px;line-height:1;font-weight:700}
.payday .lines{display:flex;flex-direction:column;gap:4px;font-size:13.5px;border-top:1px dashed color-mix(in srgb, currentColor 35%, transparent);padding-top:10px}
.payday .lines .row span:last-child{font-family:var(--f-num)}
.payday .note{font-size:12.5px;opacity:.8}

/* Barras de progreso */
.meter{position:relative;height:12px;background:var(--sunk);border-radius:999px;overflow:visible}
.meter .fill{position:absolute;left:0;top:0;bottom:0;border-radius:999px;background:var(--s-gas)}
.meter .ghost{position:absolute;left:0;top:0;bottom:0;border-radius:999px;background:color-mix(in srgb, var(--s-gas) 30%, transparent)}
.meter .tick{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink);border-radius:2px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--ink-2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}

.cats{display:flex;flex-direction:column;gap:12px}
.cat{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:baseline}
.cat .bar{grid-column:1 / -1;height:8px;background:var(--sunk);border-radius:999px;position:relative}
.cat .bar span{position:absolute;left:0;top:0;bottom:0;border-radius:999px;background:var(--accent)}
.cat .bar em{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink-2);border-radius:2px}
.cat .lbl{font-weight:500;font-size:14px}
.cat .val{font-family:var(--f-num);font-size:13.5px}
.cat .sub{grid-column:1 / -1;font-size:12px;color:var(--muted)}

.balances{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.bal{background:var(--surface);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:4px;min-width:0}
.bal .v{font-family:var(--f-body);font-variant-numeric:tabular-nums;font-size:16px;font-weight:600;letter-spacing:-.01em;white-space:nowrap}
.bal .k{font-size:12px;color:var(--muted)}
@media (max-width:380px){ .balances{grid-template-columns:1fr} }

/* Movimientos */
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px))}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:13.5px;font-weight:500;white-space:nowrap;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.sum4{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.sum4 div{display:flex;flex-direction:column;gap:2px}
.sum4 b{font-family:var(--f-num);font-weight:500;font-size:16px}
.daygrp{display:flex;flex-direction:column}
.daygrp h3{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:10px 0 4px}
.movs{background:var(--surface);border-radius:var(--r);overflow:hidden}
.mov{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;padding:11px 14px;border:0;background:none;width:100%;text-align:left;cursor:pointer}
.mov + .mov{border-top:1px solid var(--line)}
.mov .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:14px;background:var(--sunk);color:var(--ink-2)}
.mov .ic.t-ingreso{background:var(--good-soft);color:var(--good)}
.mov .ic.t-ahorro,.mov .ic.t-inversion{background:var(--accent-soft);color:var(--accent-tx)}
.mov .tt{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mov .st{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mov .am{font-family:var(--f-num);font-size:14.5px;text-align:right}
.mov .am.in{color:var(--good)}
.mov.excl{opacity:.5}
.search{flex:1;min-width:0;width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px}

/* Tablas */
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:8px 6px;text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
thead th{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;border-bottom:1px solid var(--line)}
tbody tr + tr td{border-top:1px solid var(--line)}
td.n{font-family:var(--f-num);font-variant-numeric:tabular-nums}
tfoot td{border-top:2px solid var(--ink);font-weight:600}

/* Gráfico anual */
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-family:var(--f-body);font-size:10px}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .hit{fill:transparent;cursor:pointer}
.chart .sel{fill:var(--sunk)}
.chart-cap{display:flex;justify-content:space-between;gap:10px;font-size:13px;flex-wrap:wrap}

/* Guardias */
.weeks{display:flex;flex-direction:column}
.week{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;padding:10px 0}
.week + .week{border-top:1px solid var(--line)}
.week .d{font-weight:500}
.week .p{font-size:12.5px;color:var(--muted)}
.week.past{opacity:.6}
.switch{grid-row:1 / span 2;grid-column:2;width:46px;height:28px;border-radius:999px;border:0;background:var(--sunk);position:relative;cursor:pointer}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--surface);box-shadow:0 1px 3px rgb(0 0 0 / .25);transition:left .15s}
.switch[aria-checked="true"]{background:var(--accent)}
.switch[aria-checked="true"]::after{left:21px}

/* Formularios */
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:12.5px;font-weight:600;color:var(--ink-2)}
.field input,.field select{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 11px;width:100%;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.hint{font-size:12.5px;color:var(--muted)}
.fijo{display:flex;flex-direction:column;gap:10px;padding:12px;border:1px solid var(--line);border-radius:12px}

/* Hábitos */
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--sunk);border-radius:12px;padding:3px;gap:3px}
.seg button{border:0;background:none;border-radius:9px;padding:8px;font-weight:600;font-size:14px;cursor:pointer;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0 / .12)}
.spark{grid-column:1 / -1;display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));grid-auto-flow:column;gap:3px;height:26px;align-items:end}
.spark span{background:var(--accent);border-radius:2px 2px 0 0;min-height:2px}
.spark span.off{background:var(--sunk)}
.spark-l{grid-column:1 / -1;display:grid;grid-template-columns:repeat(12,1fr);gap:3px;font-size:9.5px;color:var(--muted);text-align:center;margin-top:-2px}
/* Barra de pestañas */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:color-mix(in srgb, var(--surface) 94%, transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(6,minmax(0,1fr))}
.tab{border:0;background:none;padding:9px 0 10px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;letter-spacing:-.01em;white-space:nowrap;font-weight:600;color:var(--muted);cursor:pointer}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--accent-tx)}

/* Hoja inferior y avisos */
.scrim{position:fixed;inset:0;background:rgb(8 12 22 / .45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;border-radius:20px 20px 0 0;max-height:88%;overflow:auto;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
.sheet h3{font-family:var(--f-display);font-size:19px;margin:0;overflow-wrap:anywhere}
.sheet .raw{font-family:var(--f-num);font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;max-width:calc(100% - 32px);text-align:center}
.empty{display:flex;flex-direction:column;gap:8px;align-items:flex-start}

/* ---- Diseño «Azul oscuro» ---- */
body{font-variant-numeric:tabular-nums}
.num{letter-spacing:0;font-weight:700}
.big,.mid{font-weight:800;letter-spacing:-.02em}
h2.sec{font-weight:800}
.card{border-radius:24px;padding:18px}
.btn{font-weight:700}
.btn.ghost{border-color:var(--line)}
header.top .wrap{align-items:center;padding-block:16px 10px}
.brand{display:flex;align-items:center;gap:10px;font-size:17px;font-weight:800;letter-spacing:-.01em;min-width:0}
.brand > span:last-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
header.top .wrap{gap:8px}
.brand .logo{width:36px;height:36px;border-radius:11px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;flex:none}
.brand small{display:block;font-weight:500;font-size:12px;color:var(--muted);letter-spacing:0}
.iconbtn{width:44px;height:44px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--accent-tx);display:grid;place-items:center;cursor:pointer;padding:0}
.iconbtn svg{width:20px;height:20px}
.payday{border-radius:26px;padding:20px;gap:14px}
.payday .top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.payday .lbl{font-size:13px;font-weight:600;opacity:.92}
.payday .dias{font-size:12px;font-weight:700;background:rgba(255,255,255,.18);border-radius:999px;padding:5px 10px;white-space:nowrap}
.payday .amount{font-family:var(--f-body);font-weight:800;font-size:40px;letter-spacing:-.03em;line-height:1}
.payday .boxes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.payday .box{background:rgba(255,255,255,.14);border-radius:16px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.payday .box span{font-size:12px;opacity:.92;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.payday .box b{font-weight:700;white-space:nowrap}
.payday .note{font-size:12px;opacity:.88}
.quick{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.quick button{min-height:64px;border:1px solid var(--line);border-radius:18px;background:var(--surface);font-weight:700;font-size:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;cursor:pointer}
.quick button svg{width:20px;height:20px;stroke:var(--accent-tx)}
.quick button.warn{background:var(--warn-soft);border-color:#4A3A16;color:var(--warn)}
.quick button.warn svg{stroke:var(--warn)}
.ringrow{display:flex;gap:16px;align-items:center}
.ringrow .info{flex:1;display:flex;flex-direction:column;gap:6px;min-width:0;align-items:flex-start}
.ring{flex:none;width:104px;height:104px;border-radius:50%;display:grid;place-items:center}
.ring > div{width:78px;height:78px;border-radius:50%;background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring b{font-size:18px;font-weight:800}
.ring span{font-size:11px;color:var(--muted)}
.accs{display:flex;flex-direction:column;gap:12px}
.acc{display:flex;align-items:center;gap:12px;min-width:0}
.acc .ini,.mov .ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-family:var(--f-body);font-weight:800;font-size:12px;flex:none;background:var(--sunk);color:var(--ink-2)}
.acc .t{flex:1;min-width:0;display:flex;flex-direction:column}
.acc .t b{font-weight:700}
.acc .t span{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acc .v{font-weight:800;white-space:nowrap}
.catchips{display:flex;flex-wrap:wrap;gap:8px}
.catchips span{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:8px 12px;font-size:12px;font-weight:700;background:var(--sunk)}
.catchips i{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.catchips small{font-size:11px;font-weight:600;color:var(--muted)}
nav.tabs{left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));bottom:calc(10px + env(safe-area-inset-bottom,0px));padding:6px;border:1px solid var(--line);border-radius:24px;background:color-mix(in srgb,var(--sunk) 94%,transparent)}
nav.tabs .in{gap:2px}
.tab{border-radius:18px;padding:8px 0;color:var(--muted);font-weight:700;font-size:10px}
.tab svg{width:20px;height:20px}
.tab[aria-current="page"]{background:var(--accent);color:#FFFFFF}
main.wrap{padding-bottom:calc(112px + env(safe-area-inset-bottom,0px));gap:14px}
.toast{bottom:calc(98px + env(safe-area-inset-bottom,0px))}
.chip{background:var(--surface);border-color:var(--line);font-weight:700}
.chip[aria-pressed="true"]{background:var(--accent);color:#FFFFFF;border-color:var(--accent)}
.daygrp h3{text-transform:none;letter-spacing:0;font-size:12px;font-weight:700}
.movs{border-radius:22px}
.mov{grid-template-columns:38px 1fr auto;padding:10px 14px}
.mov + .mov{border-top:1px solid color-mix(in srgb,var(--line) 60%,transparent)}
.mov .tt{font-weight:700}
.mov .am{font-family:var(--f-body);font-weight:800}
.fijo{border-radius:16px;background:var(--sunk)}
.field input,.field select,.search{border-radius:12px;background:var(--sunk);border-color:var(--line)}
.sheet{border-radius:24px 24px 0 0}
.meter .fill{background:var(--accent)}
.meter .ghost{background:#3A4A86}
.seg button[aria-pressed="true"]{background:var(--accent);color:#FFFFFF}
/* Ajustes: menú por apartados */
.ajmenu{padding:6px 0;gap:0}
.ajmenu button{display:flex;align-items:center;gap:12px;width:100%;min-height:60px;padding:10px 16px;border:0;background:none;text-align:left;cursor:pointer}
.ajmenu button + button{border-top:1px solid color-mix(in srgb,var(--line) 60%,transparent)}
.ajmenu .aic{width:38px;height:38px;border-radius:12px;background:var(--accent-soft);color:var(--accent-tx);display:grid;place-items:center;flex:none}
.ajmenu .aic svg{width:20px;height:20px}
.ajmenu .at{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.ajmenu .at b{font-weight:700}
.ajmenu .at small{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

<script>
"use strict";
/* ---------- Constantes ---------- */
const CAT_G = ['Vivienda','Alimentación','Restaurantes y ocio','Transporte','Suscripciones','Salud y deporte','Ropa','Compras online','Financiaciones','Otros'];
const CAT_I = ['Nómina','Ventas','Otros ingresos'];
const TIPOS = {gasto:'Gasto', ingreso:'Ingreso', ahorro:'Ahorro Santander', inversion:'Trade Republic', prestamo:'Dinero prestado', excluido:'Excluido de cálculos'};
const MES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const MES3 = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const DIA = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const FESTIVOS_FIJOS = ['01-01','01-06','05-01','08-15','10-12','11-01','12-06','12-08','12-25'];
const DEF_CFG = {
  nomina:{base:0, guardia:0, ancla:'2026-10-05', cadaSemanas:3, cierreDias:0},
  guardias:{}, mediaMeses:3,
  ahorro:{saldo:0, fecha:'2026-01-01'},
  tr:{snaps:[], aportadoPrevio:0},
  fijos:[], reglas:[], festivos:[], vehiculos:{umbral:40, preguntarDesde:'2026-10-01', seguros:[]},
  reparto:{colchon:150, pctAhorro:50}, fondo:{meses:3}, huchas:[], limites:[], moto:{gasolina:true}, avisosVistos:[]
};

/* ---------- Estado ---------- */
const S = { db:null, cfg:structuredClone(DEF_CFG), cfgLoaded:false, meses:{}, mesesLoaded:false, view:'inicio', mesSel:null, anioSel:null, filtro:'todos', q:'', selMesAnio:null, offline:false, connecting:true, trmovs:null, ajFoco:null, ahorro:{} };

/* ---------- Utilidades ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2,'0');
const ymd = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parseD = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const addDays = (d,n) => new Date(d.getFullYear(), d.getMonth(), d.getDate()+n);
const mk = (y,m0) => { const d = new Date(y,m0,1); return d.getFullYear()+'-'+pad(d.getMonth()+1); };
const mkParts = k => { const [y,m] = k.split('-').map(Number); return [y, m-1]; };
const dim = (y,m0) => new Date(y, m0+1, 0).getDate();
const dayDiff = (a,b) => Math.round((Date.UTC(b.getFullYear(),b.getMonth(),b.getDate()) - Date.UTC(a.getFullYear(),a.getMonth(),a.getDate())) / 86400000);
const today = () => { const n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); };
function money(n, opt={}){
  if (n == null || isNaN(n)) return '—';
  const neg = n < -0.004; let a = Math.abs(n).toFixed(opt.dec ?? 2); let [e,d] = a.split('.');
  e = e.replace(/\B(?=(\d{3})+(?!\d))/g,'.');
  const sign = neg ? '−' : (opt.sign && n > 0.004 ? '+' : '');
  return sign + e + (d ? ','+d : '') + ' €';
}
const pct = x => { const r = Math.round(x*100); return (r>0?'+':r<0?'−':'') + Math.abs(r) + ' %'; };
const fdate = d => DIA[d.getDay()] + ' ' + d.getDate() + ' de ' + MES[d.getMonth()];
const fshort = d => d.getDate() + ' ' + MES3[d.getMonth()];
const tc = s => s.toLowerCase().replace(/(^|[\s(\/-])([a-záéíóúñü])/g, (m,a,b) => a + b.toUpperCase()).replace(/\bS\.l\.u?\.?/gi, m => m.toUpperCase());
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast._t); toast._t = setTimeout(() => t.hidden = true, 3200); }

/* ---------- Limpieza de conceptos (quita números de tarjeta y referencias) ---------- */
function sanitize(c){
  c = String(c||'');
  c = c.replace(/,?\s*TARJ\.\s*:\*\d+/g,'');
  c = c.replace(/,?\s*TARJETA\s+\d{6,}\s*,?\s*(COMISION\s+[\d.,]+)?/g,'');
  c = c.replace(/[.\s]*PAN:\s*\d+\.*/g,'');
  c = c.replace(/\s*Nº RECIBO.*$/,'');
  c = c.replace(/DEL CONTRATO[\d ]+/,'');
  c = c.replace(/\b\d{12,}\b/g,'');
  c = c.replace(/\s+/g,' ').trim().replace(/[\s,.]+$/,'');
  return c;
}
const movId = (f,i,s) => f.replace(/-/g,'') + '_' + Math.round(i*100) + '_' + Math.round((s||0)*100);

/* ---------- Clasificación ---------- */
const RX = [
  ['Suscripciones', /SPOTIFY|APPLE\.COM|OPENAI|CHATGPT|NETFLIX|\bHBO\b|DISNEY|PRIME VIDEO|AMAZON PRIME|YOUTUBE|TRYHACKME|ACENS|GOOGLE ?\*|MOVISTAR|VODAFONE|\bORANGE\b|\bDIGI\b|SIMYO|LOWI|PEPEPHONE/],
  ['Restaurantes y ocio', /TB TORRECA|TACO BELL|FEC MEDITERRANE|BOLERA|UBER.{0,3}EATS|JUST ?EAT|GLOVO|RESTAURANT|CAFETER|\bCAFE\b|\bBAR\b|SUSHI|KEBA[BP]|PIZZA|DOMINOS|MC ?DONALD|\bBK\d|BURGER|\bBURG\b|TACO|RAMEN|CERVECER|TABERNA|HELAD|CHURRER|OKTOBERFEST|HOTEL|BALNEARIO|CETURSA|SIERRA NEVADA|STEAM|\bCINE|PERGOLA|LA BALSA|ELENAS PITA|TEANO|TIERRA DE NADIE|LA LUPE|KAMADO|MAFIA DEL NO|TAGLIATELLA|CASA DE KING|EPOCA|TONTA MONA|SPICE HUT|A FUEGO|INNATA|BUENAS JUNT|BEER|DISCO|TERRAZA|HOSTELER|PASTELERIA|SUMUP|MORENA|RESTOBAR|ORILLAS DEL MAR|JARDIN DEL|SUMMER BEACH|\bBLUP\b|SHUSSKI|MIRLO BLANCO|CONSIGNAS|EVENTOS|DESERT SPRINGS|500 MILLAS|SABOR A DOS|TRASTIENDA|LATINO EXPRESS|EAST WEST|MAK TROPICAL|EL ANCLA|DULCE Y SAL|ALFARERIA/],
  ['Transporte', /REPSOL|WAYLET|PLENERGY|\bEESS\b|GASOLINER|CEPSA|\bGALP\b|\bSHELL\b|BALLENOIL|PETRONOR|NEUMATIC|\bITV\b|TALLER|MOTOR|MOTOCARD|PARKING|TELPARK|SURBUS|\bDGT\b|PEAJE|AUTOPISTA|RENFE|\bALSA\b|\bUBER\b|CABIFY|BLABLACAR|LINEA DIRECTA|ABRUIMPORT|PLAZA AYTO/],
  ['Alimentación', /MERCADONA|ALCAMPO|SUPERPLUS|CARREFOUR|\bLIDL\b|\bALDI\b|\bDIA\b|CONSUM|COVIRAN|EROSKI|HIPERCOR|CASH BOROSA|EXPENDEMUR|SELECTA|24 HORAS|KM SHOP|SUPERMERC|FRUTER|CARNICER|PANADER|DEL ROSAL|SUPERSOL|MAS Y MAS/],
  ['Salud y deporte', /FARMACIA|CLINICA|SUMMIT FIT|GIMNAS|\bGYM\b|FITNESS|DECATHLON|ESTETICA|HAROLD|BARBER|PELUQUER|DENTAL|DENTIST|OPTICA|PRIMOR|FISIO|HOSPITAL|SANITAS|ADESLAS/],
  ['Ropa', /PULL AND BEAR|PULL&BEAR|MASSIMO DUTTI|STRADIVARIUS|\bZARA\b|BERSHKA|H&M|JD SPAIN|JD SPORT|FOOT LOCKER|NEW BALANCE|\bNIKE\b|ADIDAS|PRIMARK|SPRINGFIELD|CORTEFIEL|\bMANGO\b|LEFTIES|SHEIN/],
  ['Compras online', /AMAZON|ALIPAY|ALIEXPRESS|\bTEMU\b|PCCOMPONENTES|\bEBAY\b|MIRAVIA|ZALANDO|WALLAPOP|VINTED|CDISCOUNT/],
  ['Vivienda', /ALQUILER|IBERDROLA|ENDESA|NATURGY|AQUALIA|COMUNIDAD DE PROP|\bIKEA\b|LEROY|BAZAR|BRICO/],
];
function catGasto(U){
  if (/HONDA BANK|COFIDIS|\bONEY\b|KLARNA|CAIXABANK PAYMENTS|LIQUIDACION DE LAS TARJETAS|APLAZAD|SEQURA|ORANGE AMORT|FINANCIA/.test(U)) return 'Financiaciones';
  if (/^BIZUM A FAVOR/.test(U)){
    const cc = U.split('CONCEPTO')[1] || '';
    if (/COMID|CENA|DESAY|MERIEND|HELAD|CAFE|MATCHA|CHINO|ENTRADA|SUSHI|PIZZA|TAPAS|COPAS|BEBID/.test(cc)) return 'Restaurantes y ocio';
    if (/FARMA|PASTI|MEDIC|DENTIS/.test(cc)) return 'Salud y deporte';
    if (/MOVIL|SEGURO|TELEF/.test(cc)) return 'Suscripciones';
    if (/ROPA|ZAPAT|CAMISET/.test(cc)) return 'Ropa';
    if (/GASOL/.test(cc)) return 'Transporte';
    return 'Otros';
  }
  for (const [k, r] of RX) if (r.test(U)) return k;
  return 'Otros';
}
function catBizumIn(U){
  const cc = (U.split('CONCEPTO')[1] || '').trim();
  if (/COMID|CENA|DESAY|MERIEND|HELA|CAFE|KEBAB|PIZZA|SUSHI|TACO|TAPAS|MC ?DONALD|ENTRADA|CIRCO|ESPECTACULO|HOTEL|SIERRA NEVADA|ESQUI|BEBID|COPAS|CINE|CONCIERTO|VIAJE/.test(cc)) return 'Restaurantes y ocio';
  if (/GASOL|PARKIN|PEAJE|TAXI/.test(cc)) return 'Transporte';
  if (/CHAQUETA|ZAPAT|ROPA|CAMISET|PANTALON|SUDADERA/.test(cc)) return 'Ropa';
  if (/FARMA|PASTI|MEDIC/.test(cc)) return 'Salud y deporte';
  if (/CAMARA|AMAZON|ALIEXPRESS|TEMU/.test(cc)) return 'Compras online';
  return null;
}
const SUG = new Map();
function sugerencia(m){
  if (SUG.has(m.id)) return SUG.get(m.id);
  SUG.set(m.id, null);
  const d0 = parseD(m.f); let best = null, bestScore = 1e9;
  for (let k = -4; k <= 1; k++){
    const f = ymd(addDays(d0, k));
    for (const x of (S.meses[f.slice(0,7)] || [])){
      if (x.f !== f || x.i >= 0 || x.id === m.id) continue;
      if (/HUCHA|^TRASPASO|^EMISION$/i.test(x.c) || rxCfg('santander','i').test(x.c) || rxCfg('tr','i').test(x.c) || rxCfg('empresa','i').test(x.c)) continue;
      if (/HONDA BANK|COFIDIS|ONEY|KLARNA|SPOTIFY|APPLE\.COM|OPENAI|ANTHROPIC/i.test(x.c)) continue;
      const v = -x.i, tol = Math.max(0.6, m.i * 0.06);
      for (const n of [1,2,3,4]){ const diff = Math.abs(v/n - m.i); if (diff <= tol){ const sc = diff + Math.abs(k)*0.5 + (n-1)*0.3; if (sc < bestScore){ bestScore = sc; best = x; } } }
    }
  }
  let k = null; if (best){ const c = classify(best); if (c.t === 'gasto' && !c.rev && !['Financiaciones','Suscripciones'].includes(c.k) && !fijoDe(best)) k = c.k; }
  SUG.set(m.id, k); return k;
}
function classify(m){
  if (m.t) return { t:m.t, k: m.k || (m.t==='gasto' ? 'Otros' : m.t==='ingreso' ? 'Otros ingresos' : null) };
  const U = m.c.toUpperCase(), c = m.c, i = m.i;
  if (deudaDe(m)) return { t:'prestamo', k:null };
  for (const r of (S.cfg.reglas||[])) if (r.p && U.includes(String(r.p).toUpperCase())) return { t:r.t, k:r.k || null };
  if (rxCfg('empresa','i').test(U) && i > 0) return {t:'ingreso', k:'Nómina'};
  if (i > 0 && /MANGOPAY|WALLAPOP|VINTED|MILANUNCIOS|\bEBAY\b/.test(U)) return {t:'ingreso', k:'Ventas'};
  if (/TRADE REPUBLIC/.test(U) || rxCfg('tr').test(c)) return {t:'inversion', k:null};
  if (/HUCHA|^TRASPASO|^EMISION$/.test(U.trim()) || rxCfg('santander','i').test(U)) return {t:'ahorro', k:null};
  if (i > 0 && /^BIZUM DE /.test(U)){ const kb = catBizumIn(U); if (kb) return {t:'gasto', k:kb}; return {t:'gasto', k: sugerencia(m) || 'Otros', rev:true}; }
  if (i > 0 && /DEVOLUCIONES TRIBUTARIAS|^TRANSFERENCIA|^INGRESO/.test(U)) return {t:'ingreso', k:'Otros ingresos'};
  return {t:'gasto', k:catGasto(U)};
}
function nombre(c){
  let m;
  if ((m = c.match(/^BIZUM A FAVOR DE (.+?) CONCEPTO:?\s*(.*)$/i))) return {t:'Bizum a ' + tc(m[1]), s: m[2]};
  if ((m = c.match(/^BIZUM DE (.+?) CONCEPTO\s*(.*)$/i))) return {t:'Bizum de ' + tc(m[1]), s: m[2]};
  if (rxCfg('empresa','i').test(c)) return {t:'Nómina' + ((S.cfg.yo||{}).empresaNombre ? ' · ' + S.cfg.yo.empresaNombre : ''), s:'Transferencia de la empresa'};
  if (/^EMISION$/i.test(c.trim())) return {t:'Hucha · redondeo', s:'Ahorro Santander'};
  if ((m = c.match(/Ahorro hucha Objetivo:\s*(.+)$/i))) return {t:'Hucha · ' + m[1], s:'Ahorro Santander'};
  if (/Trade Republic/i.test(c)) return {t:'Trade Republic', s:'Transferencia a tu cuenta'};
  if (/RETIRADA DE EFECTIVO/i.test(c)) return {t:'Retirada de efectivo', s:'Cajero'};
  if (/^INGRESO.*CAJERO/i.test(c)) return {t:'Ingreso en cajero', s:'Efectivo'};
  if (/^RECARGA DE SALDO/i.test(c)) return {t:'Recarga tarjeta prepago', s:''};
  if (/^DESCARGA DE SALDO/i.test(c)) return {t:'Descarga tarjeta prepago', s:'Vuelve a la cuenta'};
  if (/^LIQUIDACION DE LAS TARJETAS/i.test(c)) return {t:'Liquidación tarjeta de crédito', s:''};
  let s = c.replace(/^(PAGO MOVIL EN|COMPRA INTERNET EN|COMPRA TELEFONICA EN|COMPRA BIZUM|COMPRA|RECIBO|TRANSFERENCIA INMEDIATA A FAVOR DE|TRANSFERENCIA INMEDIATA DE|TRANSFERENCIA A FAVOR DE|TRANSFERENCIA DE|TRASPASO:|DEVOLUCION COMPRA EN|DEVOLUCION COMPRA)\s*/i, '');
  let sub = '';
  const ci = s.search(/CONCEPTO/i);
  if (ci > 0){ sub = s.slice(ci).replace(/^CONCEPTO:?\s*/i,'').replace(/[.\s]+$/,''); s = s.slice(0, ci); }
  let t = s.split(',')[0].replace(/\s*\d{1,2}\/\d{1,2}\/\d{2,4}.*$/,'').replace(/\/\d{4}\s*$/,'').replace(/[.\s]+$/,'').trim();
  if (!sub){ const rest = s.split(',').slice(1).join(',').trim(); sub = rest ? tc(rest.replace(/\sES$/,'')) : ''; }
  if (/^DEVOLUCION/i.test(c)) sub = 'Devolución' + (sub ? ' · ' + sub : '');
  return { t: tc(t || c), s: sub };
}
function patronDe(c){
  let s = c.replace(/^(PAGO MOVIL EN|COMPRA INTERNET EN|COMPRA TELEFONICA EN|COMPRA|RECIBO)\s*/i, '');
  if (/^BIZUM|^TRANSFERENCIA|^TRASPASO/i.test(c)) return c.split(/CONCEPTO/i)[0].replace(/[,.\s]+$/,'').trim();
  return s.split(',')[0].replace(/\s*\d{1,2}\/\d{1,2}\/\d{2,4}.*$/,'').trim();
}

/* ---------- Fijos ---------- */
function fijoDe(m){
  const U = m.c.toUpperCase();
  return fijosTodos().find(f => f.m && String(f.m).toUpperCase().split('|').some(p => p.trim() && U.includes(p.trim()))) || null;
}
const fijosActivos = k => fijosTodos().filter(f => f.activo !== false && (!f.fin || k <= f.fin) && (!f.desde || k >= f.desde)).map(f => (f.fin === k && Number(f.ultima)) ? { ...f, imp: Number(f.ultima) } : f).map(f => Number(f.cadaSemanas) > 0 ? { ...f, impVez: Number(f.imp), imp: Math.round(Number(f.imp) * dim(...mkParts(k)) / (7 * Number(f.cadaSemanas)) * 100) / 100 } : f);

/* ---------- Análisis por mes ---------- */
function analyze(k){
  const movs = S.meses[k] || [];
  const r = { k, movs, ing:0, gas:0, ahorro:0, inversion:0, ingCat:{}, gasCat:{}, varCat:{}, var:0, fijoReal:0, finOtras:0, fijosVistos:new Set(), nomina:0 };
  for (const m of movs){
    const c = classify(m);
    if (c.t === 'excluido') continue;
    if (c.t === 'prestamo'){ r.prestamo = (r.prestamo || 0) + m.i; continue; }
    if (c.t === 'ingreso'){ r.ing += m.i; r.ingCat[c.k] = (r.ingCat[c.k]||0) + m.i; if (c.k === 'Nómina') r.nomina += m.i; }
    else if (c.t === 'gasto'){
      const v = -m.i; r.gas += v; r.gasCat[c.k] = (r.gasCat[c.k]||0) + v;
      const f = fijoDe(m);
      if (f){ r.fijoReal += v; r.fijosVistos.add(f.id); }
      else if (c.k === 'Financiaciones'){ r.finOtras += v; }
      else { r.var += v; r.varCat[c.k] = (r.varCat[c.k]||0) + v; }
    }
    else if (c.t === 'ahorro') r.ahorro += -m.i;
    else if (c.t === 'inversion') r.inversion += -m.i;
  }
  return r;
}
const mesesConDatos = () => Object.keys(S.meses).filter(k => (S.meses[k]||[]).length).sort();
function baseline(kRef){
  const t = today(); const kHoy = mk(t.getFullYear(), t.getMonth()); const lim = kRef < kHoy ? kRef : kHoy;
  const keys = mesesConDatos().filter(k => k < lim).slice(-(S.cfg.mediaMeses || 3));
  const out = { keys, total:0, byCat:{} };
  if (!keys.length) return out;
  for (const k of keys){ const a = analyze(k); out.total += a.var; for (const c in a.varCat) out.byCat[c] = (out.byCat[c]||0) + a.varCat[c]; }
  out.total /= keys.length; for (const c in out.byCat) out.byCat[c] /= keys.length;
  return out;
}
function proyeccion(k){
  const [y,m0] = mkParts(k); const t = today();
  const D = dim(y,m0);
  const isCur = t.getFullYear()===y && t.getMonth()===m0;
  const day = isCur ? t.getDate() : (k < mk(t.getFullYear(), t.getMonth()) ? D : 0);
  const a = analyze(k), b = baseline(k);
  const act = fijosActivos(k);
  const fijosEsperados = act.reduce((s,f) => s + Number(f.imp||0), 0);
  const fijosPend = act.filter(f => !a.fijosVistos.has(f.id)).reduce((s,f) => s + Number(f.imp||0), 0);
  const restoVar = b.total * (D - day) / D;
  const proj = a.var + restoVar + a.fijoReal + (day < D ? fijosPend : 0) + a.finOtras;
  const normal = b.total + fijosEsperados;
  const esperadoHoy = b.total * day / D;
  return { a, b, day, D, isCur, fijosEsperados, fijosPend, proj, normal, esperadoHoy, ritmo: esperadoHoy > 0 ? a.var/esperadoHoy - 1 : 0, diff: proj - normal, dpct: normal > 0 ? (proj - normal)/normal : 0 };
}
function estimacionMes(k){
  const b = baseline(k);
  const act = fijosActivos(k);
  const cats = {};
  for (const c of CAT_G) cats[c] = { var: b.byCat[c] || 0, fijo: 0, fijos: [] };
  for (const f of act){ const c = cats[f.k] ? f.k : 'Otros'; cats[c].fijo += Number(f.imp||0); cats[c].fijos.push(f); }
  const total = Object.values(cats).reduce((s,c) => s + c.var + c.fijo, 0);
  return { b, cats, total, act };
}

/* ---------- Cobro y guardias ---------- */
function isBiz(d){
  const w = d.getDay(); if (w === 0 || w === 6) return false;
  if (FESTIVOS_FIJOS.includes(pad(d.getMonth()+1)+'-'+pad(d.getDate()))) return false;
  return !(S.cfg.festivos||[]).includes(ymd(d));
}
function payday(y, m0){
  let d = new Date(y, m0+1, 0);
  while (!isBiz(d)) d = addDays(d, -1);
  d = addDays(d, -1);
  while (!isBiz(d)) d = addDays(d, -1);
  return d;
}
function guardiaOn(mon){
  const o = S.cfg.guardias || {}; const key = ymd(mon);
  if (Object.prototype.hasOwnProperty.call(o, key)) return !!o[key];
  return guardiaPrevista(mon);
}
function guardiaPrevista(mon){
  const n = S.cfg.nomina; const A = parseD(n.ancla || '2026-10-05'); const N = Math.max(1, Number(n.cadaSemanas)||3);
  const w = Math.round(dayDiff(A, mon) / 7);
  return ((w % N) + N) % N === 0;
}
const lunesDe = d => addDays(d, -((d.getDay()+6)%7));
function corte(y, m0){ return addDays(payday(y,m0), -(Number(S.cfg.nomina.cierreDias)||0)); }
function mesDeCobroGuardia(mon){
  const end = addDays(mon, 6);
  let y = end.getFullYear(), m0 = end.getMonth();
  if (end > corte(y, m0)){ const d = new Date(y, m0+1, 1); y = d.getFullYear(); m0 = d.getMonth(); }
  return mk(y, m0);
}
function guardiasDelCobro(y, m0){
  const cut = corte(y, m0), prev = (() => { const d = new Date(y, m0-1, 1); return corte(d.getFullYear(), d.getMonth()); })();
  const out = [];
  for (let mon = lunesDe(addDays(prev, -6)); mon <= cut; mon = addDays(mon, 7)){
    const end = addDays(mon, 6);
    if (end > prev && end <= cut && guardiaOn(mon)) out.push(mon);
  }
  return out;
}
function cobro(y, m0){
  const n = S.cfg.nomina; const fecha = payday(y, m0); const g = guardiasDelCobro(y, m0);
  const k0 = mk(y, m0); const vac = Number((S.cfg.vacaciones || {})[k0]) || 0; const descVac = vac * (Number(n.vacDia) || 4.5);
  const est = Number(n.base||0) - descVac + g.length * Number(n.guardia||0);
  const k = mk(y, m0); const real = (S.meses[k]||[]).filter(m => classify(m).k === 'Nómina').reduce((s,m) => s + m.i, 0);
  return { fecha, guardias:g, base:Number(n.base||0), guardia:Number(n.guardia||0), est, real: real || null, k, vac, descVac };
}
function proximoCobro(){
  const t = today(); let c = cobro(t.getFullYear(), t.getMonth());
  if (t > c.fecha || c.real){ const d = new Date(t.getFullYear(), t.getMonth()+1, 1); const nx = cobro(d.getFullYear(), d.getMonth()); return { actual:c, next:nx }; }
  return { actual:null, next:c };
}
const rangoSemana = mon => { const e = addDays(mon, 6); return mon.getMonth() === e.getMonth() ? mon.getDate() + '–' + e.getDate() + ' ' + MES3[e.getMonth()] : fshort(mon) + ' – ' + fshort(e); };

/* ---------- Saldos ---------- */
function todosMovs(){ return mesesConDatos().flatMap(k => S.meses[k]); }
function saldoCuenta(){
  let best = null;
  for (const m of todosMovs()){ if (m.s == null || String(m.id).startsWith('man_')) continue; if (!best || m.f > best.f || (m.f === best.f && (m.o||0) < (best.o||0))) best = m; }
  if (!best) return null;
  const ret = todosMovs().filter(m => m.ret && String(m.id).startsWith('man_')).reduce((a,m) => a + m.i, 0);
  return { ...best, s: Math.round((best.s + ret) * 100) / 100, sExtracto: best.s, ret };
}
const ahorroMovs = () => Object.keys(S.ahorro || {}).sort().flatMap(k => S.ahorro[k] || []);
function ultimoAhorro(){ let b = null; for (const m of ahorroMovs()) if (!b || m.f > b.f || (m.f === b.f && (m.o||0) < (b.o||0))) b = m; return b; }
function saldoAhorro(){

  let s = u ? Number(u.s) : Number(a.saldo||0); const desde = u ? u.f : (a.fecha||'');

}

function yearChart(ms){

  const y = v => T + (H - T - B) * (1 - Math.max(0, v) / top);
  const cw = (W - L - R) / 12; const bw = Math.min(10, cw/2 - 3);
  let g = '';
  for (let v = 0; v <= top + 0.1; v += step) g += `<line class="grid" x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L-6}" y="${y(v)+3}" text-anchor="end">${v >= 1000 ? (v/1000).toLocaleString('es-ES') + 'k' : v}</text>`;
  ms.forEach((a, i) => {
    const x0 = L + i*cw;
    if (i === S.selMesAnio) g += `<rect class="sel" x="${x0+1}" y="${T}" width="${cw-2}" height="${H-T-B}" rx="4"/>`;
    g += `<text x="${x0 + cw/2}" y="${H-6}" text-anchor="middle">${MES3[i][0].toUpperCase()}</text>`;
    if (a){
      const xi = x0 + cw/2 - bw - 1, xg = x0 + cw/2 + 1;
      g += barPath(xi, y(a.ing), bw, y(0), 'var(--s-ing)') + barPath(xg, y(a.gas), bw, y(0), 'var(--s-gas)');
      g += `<rect class="hit" x="${x0}" y="${T}" width="${cw}" height="${H-T}" onclick="S.selMesAnio=${i};render()"><title>${MES[i]}: ingresos ${money(a.ing)}, gastos ${money(a.gas)}</title></rect>`;
    }
  });
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Ingresos y gastos por mes">${g}</svg>`;
}
function barPath(x, yTop, w, yBase, fill){
  const h = Math.max(0, yBase - yTop); if (h < 0.5) return '';
  const r = Math.min(4, w/2, h);
  return `<path fill="${fill}" d="M${x},${yBase} V${yTop + r} Q${x},${yTop} ${x + r},${yTop} H${x + w - r} Q${x + w},${yTop} ${x + w},${yTop + r} V${yBase} Z"/>`;

function niceStep(raw){ const p = Math.pow(10, Math.floor(Math.log10(raw))); const f = raw / p; return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * p; }

/* ---------- Trade Republic: posiciones y renta ---------- */
const trRows = () => (S.trmovs && S.trmovs.rows) || [];
function trFlows(){ return trRows().filter(r => r.cat === 'CASH' && /INPAYMENT|INBOUND|OUTBOUND/.test(r.ty)).reduce((s,r) => s + Number(r.a || 0), 0); }
function trFIFO(){
  const rows = trRows().slice().sort((a,b) => a.dt < b.dt ? -1 : a.dt > b.dt ? 1 : 0);
  const lots = {}, ventas = [], compras = {}, nombres = {}, pendQ = {};
  for (const r of rows){
    if (r.cat !== 'TRADING') continue; nombres[r.s] = r.n;
    const q = Math.abs(Number(r.q) || 0); if (!q){ if (r.ty === 'BUY'){ pendQ[r.s] = (pendQ[r.s] || 0) - Number(r.a) - Number(r.fee || 0); nombres[r.s] = r.n; } continue; }
    if (r.ty === 'BUY'){ const lot = { q, c: -Number(r.a) - Number(r.fee || 0), d: r.d, id: r.id }; (lots[r.s] = lots[r.s] || []).push(lot); (compras[r.s] = compras[r.s] || []).push({ d: r.d, id: r.id }); }
    else if (r.ty === 'SELL'){
      let left = q, cost = 0; const L = lots[r.s] || []; const usados = new Set();
      while (left > 1e-9 && L.length){ const l = L[0]; const take = Math.min(left, l.q); const cc = l.c * take / l.q; cost += cc; l.c -= cc; l.q -= take; left -= take; usados.add(l.id); if (l.q <= 1e-9) L.shift(); }
      const proceeds = Number(r.a) + Number(r.fee || 0);
      ventas.push({ d: r.d, dt: r.dt, n: r.n, s: r.s, ac: r.ac, q, proceeds, cost, gain: proceeds - cost, usados, incompleto: left > 1e-6 });
    }
  }
  const t = today();
  for (const v of ventas){
    if (v.gain >= 0) continue; const d = parseD(v.d); const ini = ymd(addDays(d, -61)), fin = ymd(addDays(d, 61));
    v.regla2m = (compras[v.s] || []).some(b => b.d >= ini && b.d <= fin && !v.usados.has(b.id));
    if (!v.regla2m && addDays(d, 61) >= t) v.vigilar = ymd(addDays(d, 61));
  }
  const pos = Object.entries(lots).map(([s, L]) => ({ s, n: nombres[s], q: L.reduce((a,l) => a + l.q, 0), cost: L.reduce((a,l) => a + l.c, 0) + (pendQ[s] || 0), sinQ: !!pendQ[s] })).filter(p => p.q > 1e-6);
  for (const s in pendQ) if (!pos.some(p => p.s === s)) pos.push({ s, n: nombres[s], q: 0, cost: pendQ[s], sinQ: true });
  return { ventas, pos };
}

  const { ventas, pos } = trFIFO(); const vs = ventas.filter(v => v.d.startsWith(String(Y)));
  const gan = vs.filter(v => v.gain >= 0).reduce((s,v) => s + v.gain, 0);
  const perd = vs.filter(v => v.gain < 0 && !v.regla2m).reduce((s,v) => s + v.gain, 0);
  const dif = vs.filter(v => v.gain < 0 && v.regla2m).reduce((s,v) => s + v.gain, 0);
  const cash = ty => trRows().filter(r => r.d.startsWith(String(Y)) && r.ty === ty);
  const div = cash('DIVIDEND'), int = cash('INTEREST_PAYMENT');
  const sum = (l, f) => l.reduce((s,r) => s + Math.abs(Number(r[f]) || 0), 0);
  const hasta = (S.trmovs && S.trmovs.hasta) || '';
  return `<section class="card" aria-label="Renta Trade Republic"><div class="row"><div class="eyebrow">Trade Republic · para la renta ${Y}</div>${hasta ? `<span class="pill info">hasta ${fshort(parseD(hasta))}</span>` : ''}</div>
    <div class="sum4">
      <div><span class="small muted">Ganancias</span><b class="pos">${money(gan)}</b></div>
      <div><span class="small muted">Pérdidas que cuentan</span><b>${money(perd)}</b></div>
      <div><span class="small muted">Pérdidas aplazadas*</span><b>${money(dif)}</b></div>

/* ---------- CSV ---------- */
function parseCSV(text){
  const rows = []; let row = [], cur = '', q = false;
  for (let i = 0; i < text.length; i++){
    const ch = text[i];
    if (q){ if (ch === '"'){ if (text[i+1] === '"'){ cur += '"'; i++; } else q = false; } else cur += ch; }
    else if (ch === '"') q = true;
    else if (ch === ',' || ch === ';'){ row.push(cur); cur = ''; }
    else if (ch === '\n'){ row.push(cur.replace(/\r$/,'')); rows.push(row); row = []; cur = ''; }
    else cur += ch;
  }
  if (cur || row.length){ row.push(cur); rows.push(row); }
  return rows.filter(r => r.some(c => c !== ''));
}
async function importTR(rows){
  const H = rows[0].map(h => h.trim()); const ix = n => H.indexOf(n);
  const num = v => { const n = parseFloat(String(v || '').replace(',', '.')); return isNaN(n) ? 0 : n; };
  const nuevos = rows.slice(1).map(r => ({ id: r[ix('transaction_id')], dt: r[ix('datetime')], d: r[ix('date')], cat: r[ix('category')], ty: r[ix('type')], ac: r[ix('asset_class')], n: r[ix('name')], s: r[ix('symbol')], q: num(r[ix('shares')]), a: num(r[ix('amount')]), fee: num(r[ix('fee')]), tax: num(r[ix('tax')]) })).filter(r => r.id && r.d);
  const prev = trRows().filter(r => !(String(r.id).startsWith('man-') && nuevos.some(n => n.d === r.d && n.cat === r.cat && (r.cat === 'CASH' ? Math.abs(n.a - r.a) < 0.02 : (n.s === r.s && n.ty === r.ty && (Number(r.q) ? Math.abs(Math.abs(n.q) - Math.abs(r.q)) < 1e-6 : Math.abs(n.a - r.a) < 0.02)))))); const ids = new Set(prev.map(r => r.id)); const add = nuevos.filter(r => !ids.has(r.id));
  const all = prev.concat(add); const hasta = all.reduce((m,r) => r.d > m ? r.d : m, '');
  S.trmovs = { rows: all, hasta }; await write('fin/trmovs', S.trmovs);
  toast(add.length ? `Trade Republic: ${add.length} operaciones nuevas importadas.` : 'Trade Republic: no había operaciones nuevas.'); render();
}

function parseES(x){
  let t = String(x ?? '').trim().replace(/\s|€/g, '');
  if (!t) return NaN;
  if (t.includes(',')) t = t.replace(/\./g, '').replace(',', '.');
  else if (/^-?\d{1,3}(\.\d{3})+$/.test(t)) t = t.replace(/\./g, '');
  return parseFloat(t);
}

function saveReparto(){ S.cfg.reparto = { ...S.cfg.reparto, colchon: numV('#rC'), pctAhorro: Math.max(0, Math.min(100, numV('#rP'))) }; S.cfg.fondo = { meses: +$('#rF').value }; saveCfg(); toast('Guardado'); render(); }
function leerHuchas(){ return (S.cfg.huchas||[]).map((h,i) => { const sv = $('#hS'+i).value.trim(); return { ...h, n: $('#hN'+i).value.trim() || h.n, p: $('#hP'+i).value.trim(), saldo: sv === '' ? null : numV('#hS'+i), saldoFecha: $('#hSF'+i).value || ymd(today()), meta: numV('#hM'+i) || 0, fecha: $('#hF'+i).value || '', aporteFijo: numV('#hAF'+i) || 0, pctIngresos: numV('#hAP'+i) || 0, redondeo: $('#hAR'+i).checked }; }); }
function leerSeguros(){ return (S.cfg.vehiculos.seguros||[]).map((sg,i) => ({ ...sg, veh: $('#sgV'+i).value, imp: numV('#sgM'+i), inicio: $('#sgI'+i).value, fin: $('#sgF'+i).value, m: $('#sgT'+i).value.trim(), plazos: Math.max(1, Math.round(numV('#sgP'+i)) || 1) })); }
function saveSeguros(){ S.cfg.vehiculos = { ...S.cfg.vehiculos, umbral: numV('#vU') || 40, seguros: leerSeguros() }; saveCfg(); toast('Seguros guardados'); render(); }
function addSeguro(){ S.cfg.vehiculos = { ...S.cfg.vehiculos, seguros: leerSeguros().concat([{ id:'s' + Date.now(), veh:'coche', imp:0, inicio: ymd(today()), fin:'', m:'' }]) }; render(); }
function delSeguro(i){ const l = leerSeguros(); l.splice(i,1); S.cfg.vehiculos = { ...S.cfg.vehiculos, seguros: l }; saveCfg(); render(); }
function saveHuchas(){ S.cfg.huchas = leerHuchas(); saveCfg(); toast('Huchas guardadas'); render(); }
function addHucha(){ S.cfg.huchas = leerHuchas().concat([{ id:'h' + Date.now(), n:'Nueva hucha', p:'', saldo:null, saldoFecha: ymd(today()), meta:0, fecha:'' }]); render(); }
function delHucha(i){ const l = leerHuchas(); l.splice(i,1); S.cfg.huchas = l; saveCfg(); render(); }
function leerLimites(){ return (S.cfg.limites||[]).map((l,i) => ({ ...l, k: $('#lK'+i).value, imp: numV('#lI'+i) })); }
function saveLimites(){ S.cfg.limites = leerLimites().filter(l => l.imp > 0); saveCfg(); toast('Límites guardados'); render(); }
function addLimite(){ S.cfg.limites = leerLimites().concat([{ id:'l' + Date.now(), k:'Restaurantes y ocio', imp:100 }]); render(); }
function delLimite(i){ const l = leerLimites(); l.splice(i,1); S.cfg.limites = l; saveCfg(); render(); }
function saveFijos(){ S.cfg.fijos = leerFijos(); saveCfg(); toast('Cuotas guardadas'); render(); }
function addFijo(){ S.cfg.fijos = leerFijos().concat([{ id:'f' + Date.now(), n:'Nueva cuota', imp:0, dia:1, fin:'', m:'', k:'Financiaciones', activo:true }]); render(); }
function delFijo(i){ const l = leerFijos(); l.splice(i,1); S.cfg.fijos = l; saveCfg(); render(); }
function delRegla(i){ S.cfg.reglas = (S.cfg.reglas||[]).filter((_,j) => j !== i); saveCfg(); render(); }

/* ---------- Importar extracto ---------- */
function pickFile(){ $('#fileIn').value = ''; $('#fileIn').click(); }
function loadXLSX(){
  if (window.XLSX) return Promise.resolve();
  return new Promise((res, rej) => { const s = document.createElement('script'); s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js'; s.onload = res; s.onerror = () => rej(new Error('lib')); document.head.appendChild(s); });
}
function parseNum(v){ if (typeof v === 'number') return v; const s = String(v||'').replace(/−/g,'-').replace(/\s|EUR|€/g,'').replace(/\./g,'').replace(',','.'); const n = parseFloat(s); return isNaN(n) ? null : n; }
function parseFecha(v){
  if (v instanceof Date) return ymd(v);
  if (typeof v === 'number' && window.XLSX){ const d = XLSX.SSF.parse_date_code(v); if (d) return d.y + '-' + pad(d.m) + '-' + pad(d.d); }
  const m = String(v||'').trim().match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/); if (!m) return null;
  const y = m[3].length === 2 ? '20' + m[3] : m[3]; return y + '-' + pad(m[2]) + '-' + pad(m[1]);
}
async function importFile(file){
  try{
    toast('Leyendo ' + file.name + '…');
    if (/\.csv$/i.test(file.name)){ const csv = parseCSV(await file.text()); if (csv.length && csv[0].includes('transaction_id') && csv[0].includes('account_type')){ await importTR(csv); return; } }
    let wb; const buf = await file.arrayBuffer();
    try { wb = await window.XLSX.read(buf, { type:'array' }); }
    catch(err){ if (!(window.XLSX && window.XLSX.mini)) throw err; delete window.XLSX; await loadXLSX(); wb = XLSX.read(buf, { type:'array' }); }
    const ws = wb.Sheets[wb.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(ws, { header:1, raw:true, defval:'' });
    const hi = rows.findIndex(r => r.some(c => /^fecha operaci/i.test(String(c).trim())));
    if (hi < 0){ toast('No reconozco el archivo. Usa el Excel de movimientos de Santander (cuenta corriente o de ahorro) o el CSV de transacciones de Trade Republic.'); return; }
    const H = rows[hi].map(c => String(c).trim().toLowerCase());
    const col = re => H.findIndex(h => re.test(h));
    const cF = col(/^fecha operaci/), cV = col(/^fecha valor/), cC = col(/^concepto/), cI = col(/^importe/), cS = col(/^saldo/);
    if (cF < 0 || cC < 0 || cI < 0){ toast('Faltan columnas de fecha, concepto o importe en el archivo.'); return; }
    const pos = {}; const nuevos = {}; let total = 0;
    for (const r of rows.slice(hi+1)){
      const f = parseFecha(r[cF]); const i = parseNum(r[cI]); if (!f || i == null) continue;
      const s = cS >= 0 ? parseNum(r[cS]) : null; const o = pos[f] = (pos[f] ?? -1) + 1;
      const m = { id: movId(f, i, s), f, v: parseFecha(r[cV]) || f, c: sanitize(r[cC]), i: Math.round(i*100)/100, s: s == null ? null : Math.round(s*100)/100, o };
      (nuevos[f.slice(0,7)] = nuevos[f.slice(0,7)] || []).push(m); total++;
    }
    const titulo = rows.slice(0, hi).flat().join(' ');
    if (/HUCHA DIGITAL|CUENTA (DE )?AHORRO/i.test(titulo)){
      const porAnio = {}; for (const k of Object.keys(nuevos)) for (const m of nuevos[k]) (porAnio[m.f.slice(0,4)] = porAnio[m.f.slice(0,4)] || []).push(m);
      let add = 0;
      for (const y of Object.keys(porAnio)){ const cur = (S.ahorro[y] || []).map(x => ({...x})); const ids = new Set(cur.map(x => x.id)); let ch = false;
        for (const m of porAnio[y]) if (!ids.has(m.id)){ cur.push(m); ids.add(m.id); add++; ch = true; }
        if (ch){ S.ahorro = { ...S.ahorro, [y]: cur }; await write('ahorro/' + y, { movs: cur, cuenta: 'Cuenta de ahorro' }); } }
      toast(add ? `Cuenta de ahorro: ${add} movimientos nuevos.` : 'Cuenta de ahorro: no había movimientos nuevos.'); render(); return;
    }
    let added = 0; const changed = [];
    for (const k of Object.keys(nuevos)){
      const cur = (S.meses[k]||[]).map(x => ({...x})); const ids = new Set(cur.map(x => x.id)); let ch = false;
      for (const m of nuevos[k]) if (!ids.has(m.id)){ cur.push(m); ids.add(m.id); added++; ch = true; }
      if (ch){ S.meses[k] = cur; changed.push(k); }
    }
    for (const k of Object.keys(S.meses)){
      const man = (S.meses[k] || []).filter(m => String(m.id).startsWith('man_')); if (!man.length) continue;
      const near = (a, b) => Math.abs(dayDiff(parseD(a), parseD(b))) <= 10;
      let cur = null;
      for (const m of man){
        const pool = Object.values(S.meses).flat();
        const real = pool.find(x => !String(x.id).startsWith('man_') && Math.abs(x.i - m.i) < 0.005 && near(x.f, m.f) && !x._rep);
        if (!real) continue;
        real._rep = true; const rk = real.f.slice(0,7);
        S.meses[rk] = S.meses[rk].map(x => x.id === real.id ? { ...x, ...(m.nota && !x.nota ? { nota: m.nota } : {}), ...(m.t && !x.t ? { t: m.t } : {}), ...(m.k && !x.k ? { k: m.k } : {}), ...(m.veh && !x.veh ? { veh: m.veh } : {}), ...(m.deuda && !x.deuda ? { deuda: m.deuda } : {}) } : x);
        S.meses[k] = S.meses[k].filter(x => x.id !== m.id);
        if (!changed.includes(k)) changed.push(k); if (!changed.includes(rk)) changed.push(rk);
      }
    }
    for (const k of Object.keys(S.meses)) S.meses[k] = S.meses[k].map(x => { if (!x._rep) return x; const { _rep, ...y } = x; return y; });
    for (const k of changed.sort()) await saveMes(k);
    toast(added ? `${added} movimientos nuevos importados (${total - added} ya estaban).` : `No había movimientos nuevos (${total} ya estaban).`);
    render();
  } catch(e){ toast(e && e.message === 'lib' ? 'No se ha podido cargar el lector de Excel. Revisa la conexión.' : 'No he podido leer el archivo. Descárgalo de nuevo en formato Excel.'); }
}
$('#fileIn').addEventListener('change', e => { const f = e.target.files[0]; if (f) importFile(f); });
$('#btnImport').addEventListener('click', pickFile);
document.querySelectorAll('.tab').forEach(b => b.addEventListener('click', () => setView(b.dataset.v)));
setView('inicio');

/* ---------- Conexión con la base de datos ---------- */
(async () => {
  const db = window.claude && window.claude.use ? await window.claude.use('db') : null;
  S.connecting = false;
  if (!db){ S.offline = true; S.mesesLoaded = true; render(); return; }
  S.db = db;
  db.doc('fin/config').onSnapshot(snap => {
    const d = snap.exists ? snap.data() : null;
    const c = structuredClone(DEF_CFG);
    if (d){ const x = JSON.parse(JSON.stringify(d)); Object.assign(c, x); c.nomina = { ...DEF_CFG.nomina, ...(x.nomina||{}) }; c.ahorro = { ...DEF_CFG.ahorro, ...(x.ahorro||{}) }; c.tr = { ...DEF_CFG.tr, ...(x.tr||{}) }; c.reparto = { ...DEF_CFG.reparto, ...(x.reparto||{}) }; c.fondo = { ...DEF_CFG.fondo, ...(x.fondo||{}) }; c.moto = { ...DEF_CFG.moto, ...(x.moto||{}) }; c.vehiculos = { ...DEF_CFG.vehiculos, ...(x.vehiculos||{}) }; }
    S.cfg = c; S.cfgLoaded = true; safeRender();
  }, () => {});
  db.collection('ahorro').limit(50).onSnapshot(snap => { const a = {}; snap.docs.forEach(d => { if (d.exists) a[d.id] = (d.data().movs || []); }); S.ahorro = a; safeRender(); }, () => {});
  db.doc('fin/trmovs').onSnapshot(snap => { S.trmovs = snap.exists ? JSON.parse(JSON.stringify(snap.data())) : null; safeRender(); }, () => {});
  db.collection('meses').limit(1000).onSnapshot(snap => {
    const m = {}; snap.docs.forEach(d => { if (d.exists) m[d.id] = (d.data().movs || []); });
    S.meses = m; S.mesesLoaded = true; safeRender();
  }, () => { S.mesesLoaded = true; render(); });
})();
function safeRender(){
  const a = document.activeElement;
  if ($('#sheetHost').innerHTML) return;
  if (S.view === 'ajustes' && a && a.closest && a.closest('#view') && /INPUT|SELECT/.test(a.tagName)) return;
  if (S.view === 'movs' && a && a.id === 'q') return;
  render();
}
</script>
